D.sort(function(a,b){return a[0]-b[0]});var cur=-1,list=D.slice(),i=0,card=document.getElementById("card");
function tabs(){var t=document.getElementById("tabs");t.innerHTML="";
 ["Semua"].concat(M.map(function(m,k){return "Misi "+(k+1)+" · "+m})).forEach(function(n,k){
  var b=document.createElement("button");b.textContent=n;b.className=(k-1===cur)?"on":"";
  b.onclick=function(){cur=k-1;list=D.filter(function(x){return cur<0||x[0]===cur});i=0;tabs();show()};t.appendChild(b)})}
function show(){var d=list[i];card.classList.remove("flip");
 document.getElementById("f").innerHTML='<div class="tag">Misi '+(d[0]+1)+' · '+M[d[0]]+' · '+d[1]+'</div><div class="q">'+d[2]+'</div><ul class="opts">'+d[3].map(function(o){return "<li>"+o+"</li>"}).join("")+'</ul><div class="hint">Ketuk untuk melihat jawaban</div>';
 document.getElementById("b").innerHTML='<div class="tag">Jawaban</div><div class="ans">'+d[4]+'</div><div class="exp">'+d[5]+'</div><div class="hint">Ketuk untuk kembali ke soal</div>';
 document.getElementById("cnt").textContent=(i+1)+" / "+list.length}
card.onclick=function(){card.classList.toggle("flip")};
document.getElementById("next").onclick=function(){i=(i+1)%list.length;show()};
document.getElementById("prev").onclick=function(){i=(i-1+list.length)%list.length;show()};
document.getElementById("shuf").onclick=function(){list.sort(function(){return Math.random()-.5});i=0;show()};
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")document.getElementById("next").click();if(e.key==="ArrowLeft")document.getElementById("prev").click();if(e.key===" "){e.preventDefault();card.click()}});
tabs();show();
